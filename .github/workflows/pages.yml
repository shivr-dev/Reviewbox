name: Publish Review to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Actions publishing source
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
            if (data.build_type !== 'workflow') {
              core.setFailed('Pages Source must be GitHub Actions. Open Settings > Pages > Build and deployment > Source. Branch/Jekyll publishing can overwrite this application with README.html.');
            }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_REVIEW_SHA: ${{ github.sha }}
      - name: Verify application build artifact
        run: node scripts/verify-pages.mjs pages-dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published application
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify-pages.mjs --url "$PAGE_URL" "$EXPECTED_SHA"
