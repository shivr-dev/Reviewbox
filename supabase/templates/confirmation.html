<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>验证您的 Review 邮箱</title></head>

  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">请验证您的邮箱，完成 Review 学习账户注册。</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f4ef;"><tr><td align="center" style="padding:48px 20px;">

      <tr><td style="padding:0 0 26px;font-size:32px;font-weight:700;letter-spacing:-1px;">review<span style="color:#ad6b4f;">.</span></td></tr>

        <table role="presentation" cellspacing="0" cellpadding="0" style="margin:28px 0;"><tr><td align="center" bgcolor="#ad6b4f" style="border-radius:6px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;color:#fff;font-size:16px;font-weight:600;text-decoration:none;">验证邮箱并完成注册</a></td></tr></table>
        <p style="margin:0 0 12px;font-size:14px;line-height:1.8;color:#7e776d;">如果按钮无法打开，请将以下链接复制到浏览器地址栏：</p>
        <p style="margin:0 0 26px;font-size:13px;line-height:1.7;word-break:break-all;"><a href="{{ .ConfirmationURL }}" style="color:#8d573e;">{{ .ConfirmationURL }}</a></p>
        <div style="border-top:1px solid #eee8df;padding-top:20px;"><p style="margin:0;font-size:14px;line-height:1.8;color:#7e776d;">若您未注册此账户，请忽略此邮件，无需采取其他操作。请勿将验证链接转发给他人。</p></div>
      </td></tr>
